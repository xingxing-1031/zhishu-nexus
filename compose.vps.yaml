services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  migrate:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DATABASE_POOL_MIN_SIZE: ${DATABASE_POOL_MIN_SIZE:-1}
      DATABASE_POOL_MAX_SIZE: ${DATABASE_POOL_MAX_SIZE:-4}
      DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-10}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "retail_analytics_agent.migrate"]

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      MODEL_PROVIDER: openai_compatible
      MODEL_BASE_URL: ${MODEL_BASE_URL:?set MODEL_BASE_URL}
      MODEL_NAME: ${MODEL_NAME:?set MODEL_NAME}
      MODEL_API_KEY: ${MODEL_API_KEY:?set MODEL_API_KEY}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-120}
      KNOWLEDGE_SERVICE_URL: ${KNOWLEDGE_SERVICE_URL:-http://host.docker.internal:8010}
      KNOWLEDGE_SERVICE_TOKEN: ${KNOWLEDGE_SERVICE_TOKEN:?set KNOWLEDGE_SERVICE_TOKEN}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN}
      KNOWLEDGE_DEPARTMENTS: ${KNOWLEDGE_DEPARTMENTS:-admin}
      AGENT_CONTEXT_TOKEN_BUDGET: ${AGENT_CONTEXT_TOKEN_BUDGET:-4000}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-8}
      MCP_EXPORT_ENABLED: ${MCP_EXPORT_ENABLED:-true}
      MCP_EXPORT_TIMEOUT_SECONDS: ${MCP_EXPORT_TIMEOUT_SECONDS:-15}
      MCP_COMMON_ENABLED: ${MCP_COMMON_ENABLED:-true}
      MCP_COMMON_TIMEOUT_SECONDS: ${MCP_COMMON_TIMEOUT_SECONDS:-15}
      MCP_HTTP_TIMEOUT_SECONDS: ${MCP_HTTP_TIMEOUT_SECONDS:-10}
      MCP_MAX_RESPONSE_BYTES: ${MCP_MAX_RESPONSE_BYTES:-1000000}
      LOCAL_ACCESS_USER_ID: ${LOCAL_ACCESS_USER_ID:-DEMO-USER}
      LOCAL_ACCESS_ROLE: ${LOCAL_ACCESS_ROLE:-analyst}
      PUBLIC_DEMO_MODE: ${PUBLIC_DEMO_MODE:-true}
      PUBLIC_DEMO_RATE_LIMIT_PER_MINUTE: ${PUBLIC_DEMO_RATE_LIMIT_PER_MINUTE:-6}
      PUBLIC_DEMO_MAX_ROWS: ${PUBLIC_DEMO_MAX_ROWS:-20}
      AUTH_MODE: ${AUTH_MODE:-demo}
      AUTH_USER_ID: ${AUTH_USER_ID:-ANALYST-001}
      AUTH_USERNAME: ${AUTH_USERNAME:-analyst}
      AUTH_ROLE: ${AUTH_ROLE:-analyst}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:-}
      AUTH_ADMIN_USER_ID: ${AUTH_ADMIN_USER_ID:-ADMIN-001}
      AUTH_ADMIN_USERNAME: ${AUTH_ADMIN_USERNAME:-admin-demo}
      AUTH_ADMIN_PASSWORD_HASH: ${AUTH_ADMIN_PASSWORD_HASH:-}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:-}
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-28800}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
    expose:
      - "8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
