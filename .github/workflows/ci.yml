name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: retail_analytics_ci
      POSTGRES_USER: retail_user_ci
      POSTGRES_PASSWORD: ci-only-password
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run Python regression tests
        run: python -m pytest -q

  postgres-smoke:
    name: PostgreSQL initialization smoke
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: retail_analytics
      POSTGRES_USER: retail_user
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_PORT: "55432"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose --profile demo config --quiet

      - name: Build the FastAPI demo image
        run: docker build -t retail-analytics-agent:ci .

      - name: Start a fresh pgvector database
        run: docker compose up -d --wait --wait-timeout 90 postgres

      - name: Verify migrations and seed data
        run: >-
          docker compose exec -T postgres
          psql -v ON_ERROR_STOP=1
          -U "$POSTGRES_USER"
          -d "$POSTGRES_DB"
          -f /opt/retail-db/verification/verify_delivery.sql

      - name: Show PostgreSQL logs after failure
        if: failure()
        run: docker compose logs postgres

      - name: Remove CI database resources
        if: always()
        run: docker compose down --volumes
