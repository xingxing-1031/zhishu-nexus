name: Deploy VPS release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Git commit, tag, or branch to deploy
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: production-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 1

      - name: Create release bundle
        shell: bash
        run: |
          set -euo pipefail
          git bundle create release.bundle HEAD
          git rev-parse HEAD > release.sha

      - name: Prepare SSH credentials
        shell: bash
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy selected release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          INTERNAL_SERVICE_TOKEN: ${{ secrets.INTERNAL_SERVICE_TOKEN }}
        run: |
          set -euo pipefail
          token_file="$(mktemp)"
          trap 'rm -f "$token_file"' EXIT
          printf '%s' "$INTERNAL_SERVICE_TOKEN" > "$token_file"
          chmod 600 "$token_file"
          release_sha="$(tr -d '\r\n' < release.sha)"
          scp -i ~/.ssh/vps_key ops/vps_release.sh \
            "$VPS_USER@$VPS_HOST:/tmp/retail-vps-release.sh"
          scp -i ~/.ssh/vps_key release.bundle \
            "$VPS_USER@$VPS_HOST:/tmp/retail-release.bundle"
          scp -i ~/.ssh/vps_key "$token_file" \
            "$VPS_USER@$VPS_HOST:/tmp/retail-internal-service-token"
          ssh -i ~/.ssh/vps_key \
            "$VPS_USER@$VPS_HOST" \
            "PROJECT_DIR=/home/ubuntu/retail-analytics-agent SERVICE_TOKEN_FILE=/tmp/retail-internal-service-token RELEASE_BUNDLE=/tmp/retail-release.bundle bash /tmp/retail-vps-release.sh '$release_sha'"
