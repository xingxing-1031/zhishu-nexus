services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
      - ./db/migrations/002_query_audit_logs.sql:/docker-entrypoint-initdb.d/002_query_audit_logs.sql:ro
      - ./db/migrations/003_knowledge_chunks.sql:/docker-entrypoint-initdb.d/003_knowledge_chunks.sql:ro
      - ./db/migrations/004_query_approval_logs.sql:/docker-entrypoint-initdb.d/004_query_approval_logs.sql:ro
      - ./db/migrations/005_resilience_and_idempotency.sql:/docker-entrypoint-initdb.d/005_resilience_and_idempotency.sql:ro
      - ./db/migrations/006_execution_trace.sql:/docker-entrypoint-initdb.d/006_execution_trace.sql:ro
      - ./db/migrations/007_admin_read_models.sql:/docker-entrypoint-initdb.d/007_admin_read_models.sql:ro
      - ./db/migrations/008_agent_context.sql:/docker-entrypoint-initdb.d/008_agent_context.sql:ro
      - ./db/migrations/009_workspace_conversations.sql:/docker-entrypoint-initdb.d/009_workspace_conversations.sql:ro
      - ./db/migrations/010_agent_request_runs.sql:/docker-entrypoint-initdb.d/010_agent_request_runs.sql:ro
      - ./db/migrations/011_dataset_registry.sql:/docker-entrypoint-initdb.d/011_dataset_registry.sql:ro
      - ./db/seeds/001_demo_data.sql:/docker-entrypoint-initdb.d/011_demo_data.sql:ro
      - ./db/seeds/002_richer_demo_dataset.sql:/docker-entrypoint-initdb.d/012_richer_demo_dataset.sql:ro
      - ./db/verification:/opt/retail-db/verification:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DATABASE_POOL_MIN_SIZE: ${DATABASE_POOL_MIN_SIZE:-1}
      DATABASE_POOL_MAX_SIZE: ${DATABASE_POOL_MAX_SIZE:-4}
      DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-10}
      OLLAMA_BASE_URL: ${DEMO_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-ollama}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_NAME: ${MODEL_NAME:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-120}
      LOCAL_ACCESS_USER_ID: ${LOCAL_ACCESS_USER_ID:-USER-001}
      LOCAL_ACCESS_ROLE: analyst
      PUBLIC_DEMO_MODE: ${PUBLIC_DEMO_MODE:-false}
      PUBLIC_DEMO_RATE_LIMIT_PER_MINUTE: ${PUBLIC_DEMO_RATE_LIMIT_PER_MINUTE:-6}
      PUBLIC_DEMO_MAX_ROWS: ${PUBLIC_DEMO_MAX_ROWS:-20}
      AUTH_MODE: ${AUTH_MODE:-demo}
      AUTH_USER_ID: ${AUTH_USER_ID:-ANALYST-001}
      AUTH_USERNAME: ${AUTH_USERNAME:-analyst}
      AUTH_ROLE: ${AUTH_ROLE:-analyst}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:-}
      AUTH_ADMIN_USER_ID: ${AUTH_ADMIN_USER_ID:-ADMIN-001}
      AUTH_ADMIN_USERNAME: ${AUTH_ADMIN_USERNAME:-admin-demo}
      AUTH_ADMIN_PASSWORD_HASH: ${AUTH_ADMIN_PASSWORD_HASH:-}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:-}
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-28800}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
    ports:
      - "${API_PORT:-8005}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  postgres_data:
