[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "zhishu-nexus"
version = "0.1.0"
description = "Enterprise AI agent platform connecting governed knowledge, business data, and tools."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "langgraph>=0.6,<2",
    "langgraph-checkpoint-postgres>=3,<4",
    "mcp>=1.13,<2",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
    "sqlglot>=26,<30",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
data = [
    "pandas>=2.2,<3",
    "pyarrow>=16,<22",
]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
retail_analytics_agent = ["static/*", "static/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "contract: Tool/Skill/State/Permission 边界契约测试",
    "e2e: 端到端评测",
    "fault_injection: 故障注入测试",
    "frozen: 冻结集测试",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
