services:
  postgres-final-evaluation:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${FINAL_EVALUATION_POSTGRES_DB:-retail_analytics_final_eval}
      POSTGRES_USER: ${FINAL_EVALUATION_POSTGRES_USER:-retail_final_evaluator}
      POSTGRES_PASSWORD: ${FINAL_EVALUATION_POSTGRES_PASSWORD:-change-me-final-evaluation}
    ports:
      - "127.0.0.1:${FINAL_EVALUATION_POSTGRES_PORT:-55433}:5432"
    volumes:
      - final_evaluation_postgres_data:/var/lib/postgresql/data
      - ./db/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
      - ./db/migrations/002_query_audit_logs.sql:/docker-entrypoint-initdb.d/002_query_audit_logs.sql:ro
      - ./db/migrations/003_knowledge_chunks.sql:/docker-entrypoint-initdb.d/003_knowledge_chunks.sql:ro
      - ./db/migrations/004_query_approval_logs.sql:/docker-entrypoint-initdb.d/004_query_approval_logs.sql:ro
      - ./db/migrations/005_resilience_and_idempotency.sql:/docker-entrypoint-initdb.d/005_resilience_and_idempotency.sql:ro
      - ./db/migrations/006_execution_trace.sql:/docker-entrypoint-initdb.d/006_execution_trace.sql:ro
      - ./db/migrations/007_admin_read_models.sql:/docker-entrypoint-initdb.d/007_admin_read_models.sql:ro
      - ./db/migrations/008_agent_context.sql:/docker-entrypoint-initdb.d/008_agent_context.sql:ro
      - ./db/migrations/009_workspace_conversations.sql:/docker-entrypoint-initdb.d/009_workspace_conversations.sql:ro
      - ./db/migrations/010_agent_request_runs.sql:/docker-entrypoint-initdb.d/010_agent_request_runs.sql:ro
      - ./db/migrations/011_dataset_registry.sql:/docker-entrypoint-initdb.d/011_dataset_registry.sql:ro
      - ./db/migrations/012_dataset_mapping.sql:/docker-entrypoint-initdb.d/012_dataset_mapping.sql:ro
      - ./db/migrations/013_dataset_metric_versions.sql:/docker-entrypoint-initdb.d/013_dataset_metric_versions.sql:ro
      - ./db/migrations/014_trace_payload.sql:/docker-entrypoint-initdb.d/014_trace_payload.sql:ro
      - ./evaluation/final/seed_final.sql:/docker-entrypoint-initdb.d/015_final_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api-final-evaluation:
    image: retail-analytics-agent-api
    env_file:
      - .env.vps
    environment:
      POSTGRES_DB: ${FINAL_EVALUATION_POSTGRES_DB:-retail_analytics_final_eval}
      POSTGRES_USER: ${FINAL_EVALUATION_POSTGRES_USER:-retail_final_evaluator}
      POSTGRES_PASSWORD: ${FINAL_EVALUATION_POSTGRES_PASSWORD:-change-me-final-evaluation}
      POSTGRES_HOST: postgres-final-evaluation
      POSTGRES_PORT: 5432
      MODEL_PROVIDER: openai_compatible
      MODEL_BASE_URL: ${MODEL_BASE_URL:?set MODEL_BASE_URL in .env.vps}
      MODEL_NAME: ${MODEL_NAME:?set MODEL_NAME in .env.vps}
      MODEL_API_KEY: ${MODEL_API_KEY:?set MODEL_API_KEY in .env.vps}
    ports:
      - "127.0.0.1:18000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres-final-evaluation:
        condition: service_healthy
    command: ["uvicorn", "retail_analytics_agent.app:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  final_evaluation_postgres_data:
